name: Fetch public-domain books

on:
  workflow_dispatch:
  push:
    paths:
      - 'catalog/booklist.csv'

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch verified Gutenberg texts
        run: python scripts/fetch_gutenberg.py
      - name: Commit downloaded books
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add books/en metadata/gutenberg-downloads.json
          if git diff --cached --quiet; then
            echo "No new book files to commit."
          else
            git commit -m "Add verified public-domain book texts"
            git push
          fi
